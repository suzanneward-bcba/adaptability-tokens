<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>adaptABILITY Tokens</title>
<meta name="description" content="Digital token boards and reinforcer choice for adaptABILITY Therapie.">
<meta name="theme-color" content="#fbf6ec">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Tokens">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect x='6' y='26' width='88' height='48' rx='24' fill='%23f2e9d8'/><circle cx='26' cy='50' r='10' fill='%23a12279'/><circle cx='44' cy='50' r='10' fill='%232a60a6'/><circle cx='62' cy='50' r='10' fill='%23a7cf3b'/><circle cx='80' cy='50' r='10' fill='%23fe920c'/></svg>">
<style>
:root {
  --cream: #fbf6ec;
  --paper: #fffdf8;
  --tray: #f2e9d8;
  --line: #e3d8c3;
  --ink: #2f2a33;
  --muted: #6b6670;
  --gray: #7a7a7a;
  --magenta: #a12279;
  --magenta-ink: #ffffff;
  --blue: #2a60a6;
  --lime: #a7cf3b;
  --lime-soft: #eef6d6;
  --orange: #fe920c;
  --orange-soft: #fff0da;
  --blue-soft: #e5edf8;
  --magenta-soft: #f7e4f0;
  --shadow: 0 1px 0 rgba(80, 60, 30, .08), 0 6px 18px rgba(80, 60, 30, .08);
  --danger: #b3261e;
  --tray-hi: rgba(255, 255, 255, .5);
  --well: 76px;
  --font: 'Century Gothic', CenturyGothic, AppleGothic, 'Avenir Next', Futura, 'Segoe UI', Roboto, sans-serif;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --cream: #1f1c22; --paper: #2a262e; --tray: #34303a; --line: #46404d; --ink: #f3eee4; --muted: #b9b2bd; --gray: #a4a4a4;
    --magenta: #d65aab; --magenta-ink: #1f1c22; --blue: #79a3e3; --lime: #b9dd5c; --lime-soft: #34402a; --orange: #ffab45; --orange-soft: #463521;
    --blue-soft: #263346; --magenta-soft: #43283b; --shadow: 0 6px 18px rgba(0, 0, 0, .35); --danger: #ff9b91; --tray-hi: rgba(255, 255, 255, 0); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --cream: #1f1c22; --paper: #2a262e; --tray: #34303a; --line: #46404d; --ink: #f3eee4; --muted: #b9b2bd; --gray: #a4a4a4;
  --magenta: #d65aab; --magenta-ink: #1f1c22; --blue: #79a3e3; --lime: #b9dd5c; --lime-soft: #34402a; --orange: #ffab45; --orange-soft: #463521;
  --blue-soft: #263346; --magenta-soft: #43283b; --shadow: 0 6px 18px rgba(0, 0, 0, .35); --danger: #ff9b91; --tray-hi: rgba(255, 255, 255, 0); color-scheme: dark;
}
*, *::before, *::after { box-sizing: inherit; }
html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); -webkit-text-size-adjust: 100%; }
body {
  margin: 0; min-height: 100%; background: var(--cream); color: var(--ink); font-family: var(--font);
  font-size: 18px; line-height: 1.4; -webkit-tap-highlight-color: transparent;
}
img { max-width: 100%; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; touch-action: manipulation; }
:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- top bar ---------- */
.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; align-items: center; gap: 12px;
  padding: 10px 18px; background: var(--cream); border-bottom: 1px solid var(--line); flex-wrap: wrap;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--cream); }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 20px; letter-spacing: -.01em; background: none; border: 0; padding: 4px 0; }
.brand-mark { display: grid; grid-template-columns: repeat(2, 9px); gap: 3px; }
.brand-mark i { width: 9px; height: 9px; border-radius: 50%; display: block; }
.brand small { font-weight: 400; color: var(--muted); }
.nav { display: flex; gap: 4px; flex-wrap: wrap; margin-left: auto; }
.nav button {
  border: 0; background: none; padding: 10px 14px; border-radius: 12px; min-height: 44px; color: var(--muted); font-size: 16px;
}
.nav button[aria-current="page"] { background: var(--paper); color: var(--ink); box-shadow: var(--shadow); font-weight: 700; }
.lockbtn { border: 1.5px solid var(--line); background: var(--paper); border-radius: 999px; padding: 8px 14px; min-height: 44px; font-size: 15px; }
.lockbtn.on { border-color: var(--magenta); color: var(--magenta); }

main { max-width: 1180px; margin: 0 auto; padding: 22px 18px 60px; }
h1 { font-size: 30px; margin: 4px 0 6px; letter-spacing: -.01em; }
h2 { font-size: 22px; margin: 28px 0 12px; }
h3 { font-size: 18px; margin: 0 0 6px; }
.lede { color: var(--muted); margin: 0 0 18px; max-width: 70ch; }
.row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.spacer { flex: 1; }

/* ---------- buttons ---------- */
.btn {
  border: 0; border-radius: 14px; padding: 12px 18px; min-height: 52px; font-weight: 700; font-size: 17px;
  background: var(--paper); color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--line); display: inline-flex; align-items: center; gap: 8px; justify-content: center;
}
.btn.primary { background: var(--magenta); color: var(--magenta-ink); box-shadow: none; }
.btn.blue { background: var(--blue); color: #fff; box-shadow: none; }
.btn.go { background: var(--lime); color: #1f2a07; box-shadow: none; }
.btn.warn { background: var(--paper); color: var(--danger); box-shadow: inset 0 0 0 1.5px var(--danger); }
.btn.small { min-height: 44px; padding: 8px 14px; font-size: 15px; border-radius: 12px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btn:active:not([disabled]) { transform: translateY(1px); }
.award {
  min-height: 84px; min-width: 220px; font-size: 24px; border-radius: 22px; background: var(--magenta); color: var(--magenta-ink);
  border: 0; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; gap: 12px; padding: 0 28px;
}
.award .plus { font-size: 34px; line-height: 1; }
.award[disabled] { opacity: .4; }
.hold { position: relative; overflow: hidden; }
.hold .fill { position: absolute; inset: 0; background: rgba(161, 34, 121, .18); transform-origin: left; transform: scaleX(0); }
.hold.holding .fill { transition: transform var(--hold-ms, 800ms) linear; transform: scaleX(1); }

/* ---------- home tiles ---------- */
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
.tile {
  text-align: left; border: 0; background: var(--paper); border-radius: 20px; padding: 16px; box-shadow: var(--shadow);
  display: flex; flex-direction: column; gap: 10px; min-height: 150px;
}
.tile .who { display: flex; align-items: center; gap: 12px; }
.tile .name { font-weight: 700; font-size: 20px; }
.tile .sub { color: var(--muted); font-size: 15px; }
.tag { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; padding: 4px 10px; border-radius: 999px; background: var(--tray); color: var(--ink); }
.tag.ready { background: var(--lime-soft); }
.tag.done { background: var(--blue-soft); }
.tag.off { background: var(--orange-soft); }
.avatar { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; font-size: 30px; background: var(--tray); overflow: hidden; flex: none; }
.avatar img { width: 100%; height: 100%; object-fit: cover; }
.avatar.lg { width: 72px; height: 72px; font-size: 42px; }
.notice { background: var(--orange-soft); border-radius: 16px; padding: 14px 16px; margin: 0 0 18px; display: flex; gap: 12px; align-items: flex-start; }
.notice p { margin: 0; }

/* ---------- the token tray (signature element) ---------- */
.tray {
  background: var(--tray); border-radius: 48px; padding: 16px; display: flex; flex-wrap: wrap; gap: 12px; justify-content: center;
  box-shadow: inset 0 3px 8px rgba(80, 60, 30, .14), inset 0 -2px 0 var(--tray-hi);
}
.well {
  width: var(--well); height: var(--well); border-radius: 50%; display: grid; place-items: center; position: relative;
  border: 3px dashed var(--gray); background: transparent; font-size: calc(var(--well) * .52);
}
.well .ic { opacity: .16; filter: grayscale(1); }
.well.on { border: 3px solid var(--ink); background: var(--paper); box-shadow: 0 3px 0 rgba(80, 60, 30, .18); }
.well.on .ic { opacity: 1; filter: none; }
.well.new .ic { animation: pop .45s cubic-bezier(.3, 1.6, .5, 1); }
.tray.mini { width: fit-content; max-width: 100%; border-radius: 22px; padding: 8px; gap: 6px; --well: 30px; justify-content: flex-start; }
.tray.mini .well { border-width: 2px; }
.tray.mini .well.on { border-width: 2px; box-shadow: none; }
.count { font-size: 26px; font-weight: 700; text-align: center; margin: 10px 0 0; }
.count small { display: block; font-size: 15px; font-weight: 400; color: var(--muted); }
@keyframes pop { 0% { transform: scale(.2); } 100% { transform: scale(1); } }
@keyframes glow { 0%, 100% { box-shadow: inset 0 3px 8px rgba(80, 60, 30, .14), 0 0 0 0 rgba(167, 207, 59, 0); } 50% { box-shadow: inset 0 3px 8px rgba(80, 60, 30, .14), 0 0 0 10px rgba(167, 207, 59, .35); } }
.tray.full { animation: glow 2.4s ease-in-out 2; }

/* ---------- board ---------- */
.board { display: grid; grid-template-columns: minmax(260px, 360px) 1fr; gap: 22px; align-items: start; }
.panel { background: var(--paper); border-radius: 26px; padding: 20px; box-shadow: var(--shadow); }
.wf-label { font-size: 17px; color: var(--muted); margin: 0 0 10px; }
.wf-card { border-radius: 22px; background: var(--cream); padding: 18px; text-align: center; border: 2px solid var(--line); }
.wf-card .big { font-size: 110px; line-height: 1.1; }
.wf-card img.big { width: 100%; max-height: 220px; object-fit: cover; border-radius: 16px; }
.wf-card .lbl { font-size: 26px; font-weight: 700; margin-top: 6px; }
.wf-card .meta { color: var(--muted); font-size: 15px; }
.wf-empty { border: 3px dashed var(--line); border-radius: 22px; padding: 26px 16px; text-align: center; color: var(--muted); }
.wf-empty .big { font-size: 64px; }
.goal { display: flex; align-items: center; gap: 14px; margin: 0 0 16px; }
.goal .gi { width: 60px; height: 60px; border-radius: 16px; display: grid; place-items: center; font-size: 36px; background: var(--blue-soft); overflow: hidden; flex: none; }
.goal .gi img { width: 100%; height: 100%; object-fit: cover; }
.goal .gt { font-size: 24px; font-weight: 700; }
.goal .gl { font-size: 15px; color: var(--muted); }
.state {
  margin-top: 16px; border-radius: 20px; padding: 16px 18px; display: flex; align-items: center; gap: 14px; font-size: 20px; font-weight: 700;
}
.state.ready { background: var(--lime-soft); }
.state.done { background: var(--blue-soft); }
.state .si { font-size: 34px; }
.controls { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; margin-top: 18px; }
.boardhead { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; flex-wrap: wrap; }
.boardhead .nm { font-size: 26px; font-weight: 700; }

/* ---------- choice menu ---------- */
.menu { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 14px; }
.choice {
  border: 3px solid var(--line); background: var(--paper); border-radius: 22px; padding: 14px 10px 16px; text-align: center; min-height: 190px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; position: relative;
}
.choice .ci { font-size: 72px; line-height: 1.1; }
.choice img.ci { width: 120px; height: 100px; object-fit: cover; border-radius: 14px; }
.choice .cl { font-weight: 700; font-size: 20px; }
.choice .cm { font-size: 14px; color: var(--muted); }
.choice[aria-pressed="true"] { border-color: var(--magenta); background: var(--magenta-soft); }
.choice .tick { position: absolute; top: 8px; right: 8px; background: var(--magenta); color: var(--magenta-ink); border-radius: 999px; font-size: 14px; padding: 3px 10px; font-weight: 700; }
.choice.off { opacity: .55; }
.choice.off .tick { background: var(--orange); color: #2b1800; }

/* ---------- learner (full-screen) view ---------- */
body.learnerview .bar { display: none; }
body.learnerview main { max-width: none; padding: 18px 22px 30px; }
.lv { --well: clamp(64px, 10vw, 118px); min-height: calc(100vh - 60px); display: flex; flex-direction: column; }
.lv .board { flex: 1; align-content: center; align-items: center; }
.staffcorner {
  position: fixed; right: max(12px, env(safe-area-inset-right, 0px)); bottom: calc(12px + env(safe-area-inset-bottom, 0px)); z-index: 30;
  border: 1.5px solid var(--line); background: var(--paper); color: var(--muted); border-radius: 999px; padding: 10px 16px; font-size: 14px; min-height: 44px;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
}
.sheet {
  position: fixed; left: 50%; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 40; width: min(760px, calc(100% - 24px));
  background: var(--paper); border-radius: 24px; box-shadow: 0 10px 40px rgba(0, 0, 0, .25); padding: 16px; border: 2px solid var(--magenta);
}
.sheet h3 { display: flex; justify-content: space-between; align-items: center; }

/* ---------- group ---------- */
.gcards { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
.gcard { background: var(--paper); border-radius: 22px; padding: 16px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 12px; }
.gcard .award { min-height: 64px; min-width: 0; width: 100%; font-size: 20px; }
.gcard .award .plus { font-size: 28px; }
.contrib { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); }
.contrib:first-child { border-top: 0; }
.stepper { display: inline-flex; align-items: center; gap: 6px; }
.stepper button { width: 44px; height: 44px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--paper); font-size: 22px; }
.stepper output { min-width: 2ch; text-align: center; font-weight: 700; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { border: 2px solid var(--line); background: var(--paper); border-radius: 999px; padding: 10px 16px; min-height: 48px; font-size: 16px; }
.chip[aria-pressed="true"] { border-color: var(--blue); background: var(--blue-soft); font-weight: 700; }
.chip[aria-pressed="true"]::before { content: "✓ "; }
.noticed { margin-top: 14px; color: var(--muted); text-align: center; font-size: 17px; }
.private { font-size: 14px; color: var(--muted); display: flex; gap: 6px; align-items: center; }

/* ---------- forms ---------- */
.form { display: grid; gap: 18px; max-width: 860px; }
.field label, .field .lab { display: block; font-weight: 700; margin-bottom: 6px; }
.field .hint { color: var(--muted); font-size: 15px; margin: 4px 0 0; }
input[type=text], input[type=number], input[type=password], select, textarea {
  width: 100%; padding: 12px 14px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--paper); min-height: 50px; font-size: 18px;
}
textarea { min-height: 120px; font-size: 14px; font-family: ui-monospace, Menlo, monospace; }
.pick { display: flex; gap: 8px; flex-wrap: wrap; }
.pick button {
  min-width: 56px; min-height: 56px; border-radius: 14px; border: 2px solid var(--line); background: var(--paper); font-size: 28px; padding: 4px 8px;
}
.pick button.txt { font-size: 17px; padding: 6px 16px; }
.pick button[aria-pressed="true"] { border-color: var(--magenta); background: var(--magenta-soft); box-shadow: inset 0 0 0 1px var(--magenta); }
.checks { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; }
.check { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; background: var(--paper); border: 1.5px solid var(--line); min-height: 52px; }
.check input { width: 24px; height: 24px; accent-color: var(--magenta); }
.radio-cards { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
.radio-cards label { display: block; padding: 14px; border-radius: 16px; border: 2px solid var(--line); background: var(--paper); font-weight: 400; }
.radio-cards input { accent-color: var(--magenta); width: 20px; height: 20px; vertical-align: -3px; margin-right: 6px; }
.radio-cards label:has(input:checked) { border-color: var(--magenta); background: var(--magenta-soft); }
.radio-cards b { display: inline; }
.radio-cards span { display: block; color: var(--muted); font-size: 15px; margin-top: 4px; }
.thumb { width: 64px; height: 64px; border-radius: 14px; object-fit: cover; border: 1.5px solid var(--line); }

/* ---------- token library picker ---------- */
.tokpick { background: var(--paper); border: 1.5px solid var(--line); border-radius: 20px; padding: 14px; display: grid; gap: 12px; }
.tokprev { display: flex; align-items: center; gap: 10px; --well: 56px; color: var(--muted); font-size: 15px; }
.tokprev .well { border-width: 2px; }
.pick.tabs { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 4px; -webkit-overflow-scrolling: touch; }
.pick.tabs button { white-space: nowrap; flex: none; min-height: 48px; }
.pick.tokgrid button { min-width: 60px; min-height: 60px; font-size: 32px; }

/* ---------- build-it themes ---------- */
.themebox { max-width: 560px; margin: 0 auto; }
.themebox.mini { max-width: 190px; margin: 0; }
.themebox.small { max-width: 100%; }
.lv .themebox { max-width: min(760px, 66vh * 1.33); }
.themepick { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
.themepick button { border: 2px solid var(--line); background: var(--paper); border-radius: 16px; padding: 6px; font-size: 15px; font-weight: 700; display: grid; gap: 4px; }
.themepick button[aria-pressed="true"] { border-color: var(--magenta); background: var(--magenta-soft); box-shadow: inset 0 0 0 1px var(--magenta); }
.themepick button[aria-pressed="true"] span::before { content: "✓ "; }

/* ---------- lists / history ---------- */
.list { display: grid; gap: 10px; }
.item { display: flex; align-items: center; gap: 14px; background: var(--paper); border-radius: 18px; padding: 12px 14px; box-shadow: var(--shadow); flex-wrap: wrap; }
.item .grow { flex: 1; min-width: 160px; }
.item .t { font-weight: 700; }
.item .s { color: var(--muted); font-size: 15px; }
.scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; border-radius: 16px; background: var(--paper); box-shadow: var(--shadow); }
table { border-collapse: collapse; width: 100%; font-size: 15px; }
th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-weight: 700; color: var(--muted); }

/* ---------- modal / toast / timer ---------- */
.overlay { position: fixed; inset: 0; background: rgba(30, 20, 30, .45); z-index: 60; display: grid; place-items: center; padding: 16px; }
.modal { background: var(--paper); border-radius: 24px; padding: 22px; width: min(520px, 100%); max-height: calc(100% - 20px); overflow: auto; box-shadow: 0 20px 60px rgba(0, 0, 0, .3); }
.modal.wide { width: min(980px, 100%); }
.modal h2 { margin-top: 0; }
.pinpad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 14px; }
.pinpad button { min-height: 66px; border-radius: 16px; border: 1.5px solid var(--line); background: var(--cream); font-size: 26px; font-weight: 700; }
.pindots { display: flex; justify-content: center; gap: 14px; margin: 14px 0 4px; }
.pindots i { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--ink); }
.pindots i.on { background: var(--ink); }
.err { color: var(--danger); text-align: center; min-height: 1.4em; margin: 6px 0 0; }
.toast {
  position: fixed; left: 50%; top: calc(14px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); z-index: 80; background: var(--ink); color: var(--cream);
  padding: 12px 18px; border-radius: 14px; font-size: 16px; max-width: calc(100% - 24px);
}
.timer { text-align: center; }
.timer svg { width: min(340px, 70vw); height: auto; }
.timer .tt { font-size: 56px; font-weight: 700; font-variant-numeric: tabular-nums; }
.celebrate { position: fixed; inset: 0; pointer-events: none; z-index: 50; overflow: hidden; }
.celebrate i { position: absolute; top: -20px; width: 12px; height: 12px; border-radius: 50%; animation: fall 2.6s ease-in forwards; }
@keyframes fall { to { transform: translateY(110vh) rotate(240deg); opacity: .2; } }

/* ---------- themes ---------- */
body.theme-older { font-size: 17px; }
body.theme-older .tray { border-radius: 20px; }
body.theme-older .well { border-radius: 14px; }
body.theme-older .wf-card .big { font-size: 84px; }
body.theme-older .choice .ci { font-size: 56px; }
body.reduce-motion *, body.reduce-motion *::before, body.reduce-motion *::after { animation: none !important; transition: none !important; }

/* ---------- responsive ---------- */
@media (orientation: portrait), (max-width: 860px) {
  .board { grid-template-columns: 1fr; }
  .wf-card { display: flex; align-items: center; gap: 16px; text-align: left; }
  .wf-card .big { font-size: 80px; }
  .wf-card img.big { width: 140px; }
}
@media (max-width: 560px) {
  main { padding: 16px 12px 50px; }
  h1 { font-size: 25px; }
  :root { --well: 60px; }
  .award { min-width: 0; width: 100%; }
  .nav button { padding: 8px 10px; font-size: 15px; }
  .menu { grid-template-columns: repeat(2, 1fr); }
}
@media print { .bar, .controls, .staffcorner { display: none; } }

/* ---------- Start a board ---------- */
.startbtn { min-height: 56px; font-size: 19px; }
.startform section.panel { margin: 0; }
.stephead { display: flex; align-items: center; gap: 12px; margin: 0 0 12px; font-size: 22px; }
.stepnum { width: 36px; height: 36px; border-radius: 50%; background: var(--magenta); color: var(--magenta-ink); display: grid; place-items: center; font-size: 18px; flex: none; }
.whopick { display: flex; flex-wrap: wrap; gap: 10px; }
.whopick button { display: flex; align-items: center; gap: 10px; padding: 8px 16px 8px 8px; border-radius: 999px; border: 2px solid var(--line); background: var(--paper); font: inherit; font-weight: 700; font-size: 19px; color: var(--ink); min-height: 64px; cursor: pointer; }
.whopick button[aria-pressed="true"] { border-color: var(--magenta); background: var(--magenta-soft); box-shadow: inset 0 0 0 1px var(--magenta); }
.tokrow { display: flex; gap: 20px; align-items: center; flex-wrap: wrap; }
.tokprevbig { width: min(320px, 100%); margin-left: auto; }
.startgo { min-height: 72px; font-size: 21px; padding: 0 28px; }
.libgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 8px; margin-top: 10px; }
.libitem { display: grid; justify-items: center; gap: 2px; padding: 8px 4px; border-radius: 14px; border: 2px solid var(--line); background: var(--paper); font: inherit; font-size: 14px; color: var(--ink); cursor: pointer; min-height: 88px; }
.libitem .li { font-size: 38px; line-height: 1.1; }
.libitem[aria-pressed="true"] { border-color: var(--magenta); background: var(--magenta-soft); }
.rprev { width: 96px; height: 96px; border-radius: 20px; background: var(--tray); display: grid; place-items: center; font-size: 60px; overflow: hidden; margin-bottom: 6px; }
.rprev img { width: 100%; height: 100%; object-fit: cover; }

/* ---------- full-screen learner board ---------- */
body.learnerview main { padding: 12px 18px 16px; min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; }
.lv { min-height: 0; flex: 1; }
.lvtop { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
.lvwho { display: flex; align-items: center; gap: 14px; min-width: 0; }
.lvwho .nm { display: block; font-size: 28px; font-weight: 700; }
.lvgoal { display: flex; align-items: center; gap: 8px; font-size: 18px; color: var(--muted); margin-top: 2px; }
.lvgoal .gi { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; font-size: 20px; background: var(--blue-soft); overflow: hidden; }
.lvgoal .gi img { width: 100%; height: 100%; object-fit: cover; }
.rcorner { flex: none; display: grid; justify-items: center; gap: 2px; width: clamp(130px, 16vw, 190px); padding: 10px; border-radius: 22px; background: var(--paper); border: 3px solid var(--magenta); box-shadow: var(--shadow); font: inherit; color: var(--ink); cursor: pointer; }
.rcorner[disabled] { cursor: default; }
.rcorner .rl { font-size: 14px; color: var(--muted); }
.rcorner .rc-ic { font-size: clamp(54px, 7vw, 84px); line-height: 1.1; }
.rcorner img.rc-ic { width: 100%; height: clamp(70px, 10vw, 110px); object-fit: cover; border-radius: 14px; }
.rcorner .rn { font-weight: 700; font-size: 18px; text-align: center; }
.rcorner.wait { border-style: dashed; border-color: var(--line); }
.rcorner.ask { border-style: dashed; animation: askpulse 1.6s ease-in-out infinite; }
@keyframes askpulse { 50% { transform: scale(1.04); } }
.lvstage { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 6px; padding-top: 6px; }
.lv .lvstage .themebox { width: 100%; max-width: min(1200px, calc((100vh - 250px) * 1.333)); max-width: min(1200px, calc((100dvh - 250px) * 1.333)); }
.lvstage .count { margin-top: 2px; }
.lvstage .state { width: min(760px, 100%); }
.lvprize { display: flex; align-items: center; gap: 14px; font-size: 26px; font-weight: 700; }
.lvprize .big { font-size: 64px; line-height: 1; }
.lvprize img.big { width: 90px; height: 90px; object-fit: cover; border-radius: 16px; }
.keepbtn { min-height: 76px; font-size: 22px; display: inline-flex; align-items: center; gap: 10px; }
.keepbtn .kb-ic { font-size: 40px; }
.keepbtn img.kb-ic { width: 48px; height: 48px; object-fit: cover; border-radius: 10px; }
body.reduce-motion .rcorner.ask { animation: none; }
@media (max-width: 700px) {
  .lvtop { flex-direction: column-reverse; align-items: stretch; }
  .rcorner { width: auto; grid-template-columns: auto 1fr; justify-items: start; align-items: center; text-align: left; }
  .rcorner .rl { grid-column: 1 / -1; }
  .rcorner .rc-ic { font-size: 44px; }
  .lv .lvstage .themebox { max-width: 100%; }
}
.lv .lvstage.done .themebox { max-width: min(1000px, calc((100vh - 360px) * 1.333)); max-width: min(1000px, calc((100dvh - 360px) * 1.333)); }
.lvstage.done .state { margin-top: 4px; }
.rcorner.ready { border-color: var(--lime); background: var(--lime-soft); animation: askpulse 1.4s ease-in-out 3; }

/* ---------- pictures (shared with Pick and Play) ---------- */
.pic { display: inline-grid; place-items: center; flex: none; line-height: 0; }
.pic svg { width: 100%; height: 100%; display: block; }
.choice .ci.pic { width: 92px; height: 92px; }
.wf-card .big.pic { width: 150px; height: 150px; }
.wf-empty .big .pic { width: 84px; height: 84px; }
.rcorner .rc-ic.pic { width: clamp(64px, 8vw, 104px); height: clamp(64px, 8vw, 104px); }
.keepbtn .kb-ic.pic { width: 48px; height: 48px; }
.state .si.pic { width: 42px; height: 42px; }
.rtag { display: inline-flex; align-items: center; gap: 6px; }
.rtag .tg { width: 24px; height: 24px; border-radius: 6px; object-fit: cover; }
.check .ck { width: 32px; height: 32px; border-radius: 8px; object-fit: cover; }
.libitem .li { width: 52px; height: 52px; }
.libitem .li.none { border: 2px dashed var(--line); border-radius: 12px; }
.rprev svg { width: 78px; height: 78px; }
.goal .gi svg, .lvgoal .gi svg { width: 82%; height: 82%; }
.goal .gi { background: var(--paper); border: 2px solid var(--line); }
.avatar.initials { color: #fff; font-weight: 700; font-size: 26px; }
.avatar.lg.initials { font-size: 36px; }
.avatar.grp { background: var(--paper); border: 2px solid var(--line); }
.avatar.grp svg { width: 80%; height: 80%; }
.noticei { width: 30px; height: 30px; border-radius: 50%; background: var(--orange); color: #2b1800; font-weight: 700; display: grid; place-items: center; flex: none; font-family: Georgia, serif; font-style: italic; }
.well.dot { --well: 22px; border-width: 2px; }
.well.dot.on { background: var(--magenta); border-color: var(--magenta); box-shadow: none; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .pic svg, :root:not([data-theme="light"]) .themebox svg { filter: none; } }

</style>

<script>

(function (root) {

    { id: 'ocean', en: 'Ocean', de: 'Meer', items: '🐳 🐋 🐬 🐟 🐠 🐡 🐙 🦀 🦞 🦈 🦭 🦑 🐚 🐊 🐸 🌊' },

    { id: 'space', en: 'Space & weather', de: 'Weltall & Wetter', items: '⭐ 🌟 ✨ 🌙 ☀️ 🪐 ☄️ 🌍 🌈 ☁️ ⚡ ❄️ 🔥 💫 🌠' },

    { id: 'sports', en: 'Sports & play', de: 'Sport & Spiel', items: '⚽ 🏀 🏈 ⚾ 🎾 🏐 🏓 🥏 🎯 🪁 🛹 🎳 🏆 🥇 🎲 🧩 🧸 🪀 🎮' },
    { id: 'music', en: 'Music & art', de: 'Musik & Kunst', items: '🎵 🎶 🎸 🥁 🎹 🎺 🎻 🎤 🎧 🎨 🖍️ ✏️ 📚 🎭 🎬' },
    { id: 'fantasy', en: 'Fantasy', de: 'Fantasie', items: '🦄 🧚 🧜 🧙 👑 🏰 🪄 💎 🔮 🤖 👾 👻 🐲 🌈' },
    { id: 'symbols', en: 'Symbols & colors', de: 'Symbole & Farben', items: '✔️ ✅ ❤️ 🧡 💛 💚 💙 💜 🤍 🔴 🟠 🟡 🟢 🔵 🟣 🟥 🟧 🟨 🟩 🟦 🟪 🔷 🔶 ➕ 💯 👍 🙌 👏 🔒 🔑' },
    { id: 'celebrate', en: 'Celebrations', de: 'Feste', items: '🎈 🎉 🎊 🎁 🎂 🎃 🎄 ⛄ 🐣 🏖️ 🎆 🪅' }
  ];
  TOKEN_LIBRARY.forEach(function (c) { c.items = c.items.split(' '); });
  function tokenIcon(style) {
    if (!style) return '⭐';
    return TOKEN_STYLES[style] || style;
  }
  var FILL_MODES = ['group', 'ownStaff', 'ownAll'];
  var CATEGORIES = ['play', 'sensory', 'creative', 'movement', 'screen', 'food', 'social', 'group', 'other'];
  /* Old picture-token styles map to the closest animated board. */
  var STYLE_TO_THEME = { rocket: 'rocket', train: 'train', car: 'train', dino: 'dino', flower: 'flower', fish: 'treasure', gem: 'treasure', heart: 'flower', star: 'rainbow', paw: 'egg', ball: 'puzzle', check: 'puzzle' };
  var DEFAULT_THEME = 'cookie';
  /* Older saves used emoji pictures; map them to the matching Pick and Play picture. */
  var EMOJI_PIC = { '🫧': 'bubbles', '🖍': 'draw', '🎵': 'music', '🧱': 'blocks', '🌈': 'lightshow', '🎲': 'game', '🙌': 'circletime', '🪂': 'playground', '💃': 'jump', '📱': 'videogame', '📺': 'videogame', '🚗': 'cars', '🧸': 'baby', '⚽': 'ball', '🛝': 'slide', '🧩': 'puzzle', '📖': 'book', '🎨': 'paint', '🥁': 'music', '🪀': 'game', '🏀': 'ball', '🎮': 'videogame', '🐾': 'animals', '🌟': 'game', '🧃': 'snack', '🍪': 'snack' };
  var GOAL_PIC = { '🤝': 'game', '⭕': 'circletime', '👕': 'dressup', '🧹': 'kitchen', '🪑': 'tablework', '🧩': 'puzzle', '🍽': 'snack', '📚': 'book', '🙌': 'circletime' };
  function themeFor(style) { return STYLE_TO_THEME[style] || DEFAULT_THEME; }

  function newBoard() {
    return { earned: 0, selectedId: null, status: 'earning', cycle: 1, lastAwardAt: 0, startedAt: new Date().toISOString() };
  }
  function newSharedBoard() {
    return { contrib: {}, stack: [], selectedId: null, status: 'earning', cycle: 1, lastAwardAt: {}, startedAt: new Date().toISOString() };
  }

  function defaultSettings() {
    return { lang: 'en', theme: 'young', sound: true, tokenSound: 'chime', soundV: 2, motion: 'system', pin: '1234', pinChanged: false, seenNotice: false };
  }

  /* A fresh install starts with no learners and no groups (only starter reinforcers). */
  function seed() {
    var d = demo();
    d.learners = []; d.groups = [];
    return d;
  }
  /* Sample learners and groups for training and tests (open the app with ?demo=1 on an empty device). */
  function demo() {
    function r(id, label, category, pic, duration, group) {
      return { id: id, label: label, category: category, pic: pic, image: null, duration: duration || 0, available: true, group: !!group };
    }
    var reinforcers = [
      r('r-trampoline', L('Trampoline', 'Trampolin'), 'movement', 'jump', 5, true),
      r('r-bubbles', L('Bubbles', 'Seifenblasen'), 'sensory', 'bubbles', 3, true),
      r('r-swing', L('Swing', 'Schaukel'), 'movement', 'swing', 3),
      r('r-lightshow', L('Light show', 'Lichtshow'), 'sensory', 'lightshow', 5),
      r('r-cars', L('Cars', 'Autos'), 'play', 'cars', 5),
      r('r-animals', L('Animals', 'Tiere'), 'play', 'animals', 5),
      r('r-trains', L('Trains', 'Eisenbahn'), 'play', 'train', 5),
      r('r-balloons', L('Balloons', 'Luftballons'), 'sensory', 'balloons', 3, true),
      r('r-candy', L('Candy', 'Süßigkeiten'), 'food', 'candy', 0, true)
    ];
    function learner(id, name, avatar, tokenStyle, target, goalText, goalPic, timing, rids) {
      return {
        id: id, name: name, avatar: null, avatarImage: null, tokenStyle: tokenStyle, target: target,
        goal: { text: goalText, pic: goalPic, image: null }, choiceTiming: timing, reinforcerIds: rids, board: newBoard()
      };
    }
    var learners = [
      learner('l-mia', 'Mia', '', 'star', 5, L('Take turns', 'Abwechseln'), 'game', 'before', ['r-bubbles', 'r-cars', 'r-swing', 'r-lightshow']),
      learner('l-leo', 'Leo', '', 'car', 3, L('Ask for help', 'Um Hilfe bitten'), null, 'after', ['r-lightshow', 'r-trains', 'r-animals', 'r-bubbles']),
      learner('l-noor', 'Noor', '', 'heart', 5, L('Join circle time', 'Beim Stuhlkreis mitmachen'), 'circletime', 'before', ['r-swing', 'r-animals', 'r-cars']),
      learner('l-jk', 'J.K.', '', 'check', 10, L('Practice getting dressed', 'Anziehen üben'), 'dressup', 'after', ['r-swing', 'r-trains', 'r-cars'])
    ];
    learners[0].tokenType = 'theme'; learners[0].theme = 'cookie';
    learners[1].tokenType = 'theme'; learners[1].theme = 'train';
    learners[2].tokenType = 'theme'; learners[2].theme = 'flower';
    learners[3].tokenType = 'theme'; learners[3].theme = 'dino';
    var shared = newSharedBoard();
    shared.contrib = { 'l-mia': { target: 3, earned: 0 }, 'l-leo': { target: 2, earned: 0 }, 'l-noor': { target: 3, earned: 0 }, 'l-jk': { target: 4, earned: 0 } };
    var groups = [
      { id: 'g-morning', name: L('Morning group', 'Morgengruppe'), type: 'individual', memberIds: ['l-mia', 'l-leo', 'l-noor'] },
      {
        id: 'g-kitchen', name: L('Social Kitchen team', 'Social-Kitchen-Team'), type: 'team', memberIds: ['l-mia', 'l-noor', 'l-jk'],
        target: 10, tokenStyle: 'flower', reinforcerIds: ['r-trampoline', 'r-candy', 'r-balloons'],
        tokenFill: 'ownStaff', examples: [L('Helping a friend', 'Einem Freund helfen'), L('Taking turns', 'Abwechseln'), L('Sharing materials', 'Material teilen'), L('Kind words', 'Freundliche Worte')],
        board: Object.assign(newBoard(), { stack: [] })
      },
      {
        id: 'g-rocket', name: L('Circle time rocket', 'Stuhlkreis-Rakete'), type: 'team', memberIds: ['l-mia', 'l-leo', 'l-noor'],
        target: 8, tokenStyle: 'rocket', tokenType: 'theme', theme: 'rocket', tokenFill: 'group', reinforcerIds: ['r-candy', 'r-trampoline', 'r-balloons'],
        examples: [L('Waiting for a turn', 'Auf den eigenen Zug warten'), L('Listening to a friend', 'Einem Freund zuhören'), L('Joining the song', 'Beim Lied mitmachen')],
        board: Object.assign(newBoard(), { stack: [] })
      },
      {
        id: 'g-friday', name: L('Friday shared goal', 'Gemeinsames Freitagsziel'), type: 'shared', memberIds: ['l-mia', 'l-leo', 'l-noor', 'l-jk'],
        tokenStyle: 'rocket', tokenFill: 'group', reinforcerIds: ['r-candy', 'r-trampoline', 'r-balloons'], defaultTarget: 3, board: shared
      }
    ];
    return { app: APP_ID, schema: SCHEMA, settings: defaultSettings(), reinforcers: reinforcers, learners: learners, groups: groups, log: [] };
  }

  function ensureShape(s) {
    if (!s || typeof s !== 'object') return seed();
    var out = s;
    out.app = APP_ID;
    out.schema = SCHEMA;
    out.settings = Object.assign(defaultSettings(), out.settings || {});
    delete out.settings.tts;
    if (out.settings.soundV !== 2) { out.settings.tokenSound = 'chime'; out.settings.soundV = 2; }
    out.reinforcers = Array.isArray(out.reinforcers) ? out.reinforcers : [];
    out.learners = Array.isArray(out.learners) ? out.learners : [];
    out.groups = Array.isArray(out.groups) ? out.groups : [];
    out.log = Array.isArray(out.log) ? out.log : [];
    out.reinforcers.forEach(function (r) {
      if (r.available === undefined) r.available = true;
      if (!r.pic) r.pic = EMOJI_PIC[String(r.icon || '').replace(/\uFE0F/g, '')] || 'game';
      if (!r.duration) r.duration = 0;
    });
    out.learners.forEach(function (l) {
      l.board = Object.assign(newBoard(), l.board || {});
      l.target = clampInt(l.target, 1, 30, 5);
      l.reinforcerIds = Array.isArray(l.reinforcerIds) ? l.reinforcerIds : [];
      l.goal = l.goal || { text: '', pic: null, image: null };
      if (l.goal.pic === undefined) l.goal.pic = GOAL_PIC[String(l.goal.icon || '').replace(/\uFE0F/g, '')] || null;
      l.choiceTiming = l.choiceTiming === 'after' || l.choiceTiming === 'both' ? l.choiceTiming : 'before';
      if (l.tokenType !== 'theme' || !l.theme) { l.tokenType = 'theme'; l.theme = l.theme || themeFor(l.tokenStyle); }
    });
    out.groups.forEach(function (g) {
      if (g.type !== 'individual' && (g.tokenType !== 'theme' || !g.theme)) { g.tokenType = 'theme'; g.theme = g.theme || themeFor(g.tokenStyle); }
      g.memberIds = (g.memberIds || []).filter(function (id) { return !!findLearner(out, id); });
      if (g.type === 'team') {
        g.board = Object.assign(newBoard(), g.board || {});
        g.target = clampInt(g.target, 1, 40, 10);
        g.examples = g.examples || [];
        g.reinforcerIds = g.reinforcerIds || [];
        if (!Array.isArray(g.board.stack)) g.board.stack = [];
        while (g.board.stack.length < g.board.earned) g.board.stack.unshift(null);
        if (g.board.stack.length > g.board.earned) g.board.stack = g.board.stack.slice(-g.board.earned || g.board.stack.length);
        if (g.board.earned === 0) g.board.stack = [];
        if (FILL_MODES.indexOf(g.tokenFill) === -1) g.tokenFill = 'group';
      } else if (g.type === 'shared') {
        if (FILL_MODES.indexOf(g.tokenFill) === -1) g.tokenFill = 'group';
        g.board = Object.assign(newSharedBoard(), g.board || {});
        g.reinforcerIds = g.reinforcerIds || [];
        g.defaultTarget = clampInt(g.defaultTarget, 1, 20, 3);
        syncSharedMembers(out, g);
      }
    });
    return out;
  }

  /* ---------- lookups ---------- */
  function findLearner(s, id) { for (var i = 0; i < s.learners.length; i++) if (s.learners[i].id === id) return s.learners[i]; return null; }
  function findGroup(s, id) { for (var i = 0; i < s.groups.length; i++) if (s.groups[i].id === id) return s.groups[i]; return null; }
  function findReinforcer(s, id) { for (var i = 0; i < s.reinforcers.length; i++) if (s.reinforcers[i].id === id) return s.reinforcers[i]; return null; }

  /* A "scope" identifies one board:
     {type:'learner', id}  |  {type:'team', groupId}  |  {type:'shared', groupId}
     Shared awards/undo also take a learnerId. */
  function resolve(s, scope) {
    if (!scope) return null;
    if (scope.type === 'learner') {
      var l = findLearner(s, scope.id);
      if (!l) return null;
      return { kind: 'learner', owner: l, board: l.board, target: l.target, reinforcerIds: l.reinforcerIds, learner: l, group: null };
    }
    var g = findGroup(s, scope.groupId);
    if (!g) return null;
    if (scope.type === 'team' && g.type === 'team') return { kind: 'team', owner: g, board: g.board, target: g.target, reinforcerIds: g.reinforcerIds, learner: null, group: g };

    return null;
  }

  function sharedTotals(g) {
    var t = 0, e = 0;
    (g.memberIds || []).forEach(function (id) {
      var c = g.board.contrib[id];
      if (!c) return;
      t += c.target;
      e += Math.min(c.earned, c.target);

  }
  function syncSharedMembers(s, g) {

    g.memberIds.forEach(function (id) {
      if (!b.contrib[id]) b.contrib[id] = { target: g.defaultTarget || 3, earned: 0 };
    });
    Object.keys(b.contrib).forEach(function (id) {
      if (g.memberIds.indexOf(id) === -1) delete b.contrib[id];
    });
    b.stack = (b.stack || []).filter(function (id) { return g.memberIds.indexOf(id) !== -1; });
  }

  function progress(s, scope) {
    var r = resolve(s, scope);
    if (!r) return null;
    if (r.kind === 'shared') {
      var t = sharedTotals(r.group);
      return { earned: t.earned, target: t.target, status: r.board.status };
    }
    return { earned: r.board.earned, target: r.target, status: r.board.status };
  }

  /* Which picture goes in each filled slot of a collective board.
     view: 'staff' or 'display'. Learner tokens appear when the group's fill mode allows it for that view. */
  function slotIcons(s, scope, view) {
    var r = resolve(s, scope);
    if (!r || r.kind === 'learner') return null;
    var g = r.group, groupIcon = tokenIcon(g.tokenStyle);
    var own = g.tokenFill === 'ownAll' || (g.tokenFill === 'ownStaff' && view === 'staff');
    var p = progress(s, scope), shown = Math.min(p.earned, p.target), out = [];
    var stack = (g.board.stack || []);

  /* ---------- log ---------- */
  function addLog(s, r, kind, extra) {
    var lang = 'en';
    var sel = r.board.selectedId ? findReinforcer(s, r.board.selectedId) : null;
    var p = r.kind === 'shared' ? sharedTotals(r.group) : { earned: r.board.earned, target: r.target };
    var entry = {
      id: uid(),
      ts: (extra && extra.ts) || new Date().toISOString(),
      kind: kind,
      arrangement: r.kind,
      learnerId: r.learner ? r.learner.id : (extra && extra.learnerId) || null,
      learnerName: r.learner ? r.learner.name : (extra && extra.learnerName) || '',
      groupId: r.group ? r.group.id : null,
      groupName: r.group ? txt(r.group.name, lang) : '',
      goal: r.learner ? txt(r.learner.goal && r.learner.goal.text, lang) : '',

      progress: p.earned + '/' + p.target,
      reinforcer: sel ? txt(sel.label, lang) : '',

  }

  function checkComplete(s, r) {
    var p = r.kind === 'shared' ? sharedTotals(r.group) : { earned: r.board.earned, target: r.target };

  /* ---------- actions (mutate state, return result) ---------- */

      var lid = scope.learnerId;
      var c = b.contrib[lid];

      if (nowMs - last < DEBOUNCE_MS) return { ok: false, reason: 'debounce' };
      b.lastAwardAt[lid] = nowMs;
      c.earned += 1;
      b.stack.push(lid);

      addLog(s, r, 'award', { tokens: 1, learnerId: lid, learnerName: ln ? ln.name : '', note: opts.note || '' });

  }

  function select(s, scope, reinforcerId) {

      else h += '<button class="btn primary" style="min-height:72px" data-a="openChoice" ' + scopeAttrs(sc) + '>' + esc(t('needChoice')) + '</button>';
      h += holdBtn('undo', t('holdUndo'), scopeAttrs(sc));
    } else if (b.status === 'delivered') {
      if (info.sel && info.sel.duration) h += '<button class="btn blue" data-a="timer" ' + scopeAttrs(sc) + '>⏱ ' + esc(t('startTimer', { m: info.sel.duration })) + '</button>';
      h += '<button class="btn primary" style="min-height:72px;font-size:20px" data-a="newBoard" ' + scopeAttrs(sc) + '>↻ ' + esc(t('newBoard')) + '</button>';

  }
  function goalBlock(info) {
    var r = info.r;
    if (r.kind === 'learner') {
      var g = r.learner.goal || {};
      var gi = g.image ? '<img alt="" src="' + g.image + '">' : window.ATPics.svg(g.pic || 'goal');
      return '<div class="goal"><span class="gi" aria-hidden="true">' + gi + '</span><span><span class="gl">' + esc(t('goalLabel')) + '</span><br><span class="gt">' + esc(tx(g.text)) + '</span></span></div>';
    }
    var lbl = r.kind === 'team' ? t('teamBoard') : t('sharedGoal');
    return '<div class="goal"><span class="gi" aria-hidden="true">' + window.ATPics.svg(r.kind === 'team' ? 'group' : 'goal') + '</span><span><span class="gl">' + esc(tx(r.group.name)) + '</span><br><span class="gt">' + esc(lbl) + '</span></span></div>';
  }
  function trayBlock(sc, info, mode) {
    var p = info.p, k = fxKey(boardScope(sc));
    var icons = C.slotIcons(S, boardScope(sc), mode === 'staff' ? 'staff' : 'display');
    var newIndex = ui.fx ? (ui.fx.bkey === k ? ui.fx.bidx : ui.fx.key === k ? ui.fx.index : -1) : -1;
    var full = p.status === 'complete' && ui.fx && ui.fx.bkey === k && ui.fx.completed;
    var left = p.target - Math.min(p.earned, p.target);
    var vis = info.themeId ? themeSvg(info.themeId, p.earned, p.target, { newIdx: newIndex, animateDone: full }) : tray(p.earned, p.target, info.style, { newIndex: newIndex, full: full, icons: icons });
    return vis +
      '<p class="count">' + esc(t('ofN', { e: Math.min(p.earned, p.target), t: p.target })) + (p.status === 'earning' && left > 0 ? '<small>' + esc(t('tokensAway', { n: left })) + '</small>' : '') + '</p>';
  }
  function boardBody(sc, mode) {
    var info = boardInfo(sc);
    if (!info) return '';
    var right = '<div class="panel">' + goalBlock(info) + trayBlock(sc, info, mode) + statePanel(sc, info, mode);
    if (info.r.kind === 'team') right += teamNoticed(info.r.group, mode);
    if (mode === 'staff') {
      if (info.r.kind === 'team') right += teamChips(info.r.group);
      right += staffControls(sc, info);
    }
    right += '</div>';
    return '<div class="board">' + wfPanel(sc, info, mode) + right + '</div>';
  }
  function teamChips(g) {
    if (g.board.status !== 'earning') return '';
    var h = '';
    {
      var who = ui.teamWho[g.id] || '';
      h += '<p class="private" style="margin:16px 0 6px">' + esc(t('whoEarned')) + '</p><div class="chips" role="group">' +
        '<button class="chip" data-a="teamWho" data-g="' + esc(g.id) + '" data-l="" aria-pressed="' + (who === '') + '">' + esc(t('wholeGroup')) + '</button>' +
        g.memberIds.map(function (id) {
          var l = C.findLearner(S, id);
          if (!l) return '';
          return '<button class="chip" data-a="teamWho" data-g="' + esc(g.id) + '" data-l="' + esc(id) + '" aria-pressed="' + (who === id) + '">' + esc(l.name) + '</button>';
        }).join('') + '</div>';
    }

  function exampleChips(g) {
    var cur = ui.teamExample[g.id] == null ? 0 : ui.teamExample[g.id];
    if (!g.examples.length) return '';
    return '<div class="chips" style="margin-top:16px" role="group">' + g.examples.map(function (ex, i) {
      return '<button class="chip" data-a="teamEx" data-g="' + esc(g.id) + '" data-i="' + i + '" aria-pressed="' + (cur === i) + '">' + esc(tx(ex)) + '</button>';
    }).join('') + '<button class="chip" data-a="teamEx" data-g="' + esc(g.id) + '" data-i="-1" aria-pressed="' + (cur === -1) + '">' + esc(t('noExample')) + '</button></div>';
  }
  function teamNoticed(g, mode) {
    var notes = [];
    for (var i = S.log.length - 1; i >= 0 && notes.length < 3; i--) {
      var e = S.log[i];
      if (e.groupId === g.id && e.cycle === g.board.cycle && e.kind === 'award' && e.note) {
        var lbl = e.note;
        g.examples.forEach(function (ex) { if (C.txt(ex, 'en') === e.note) lbl = tx(ex); });
        if (notes.indexOf(lbl) === -1) notes.push(lbl);
      }
    }
    if (!notes.length) return '';
    return '<p class="noticed">' + esc(t('noticed')) + ' ' + notes.map(esc).join(' · ') + '</p>';
  }

  /* ---------------- learner board (staff) ---------------- */
  function viewBoard() {
    var l = C.findLearner(S, ui.route.id);

    return '<div class="boardhead">' + back + avatar(l, 'lg') + '<span class="nm">' + esc(l.name) + '</span><span class="spacer"></span>' +
      '<button class="btn small" data-a="lv" ' + scopeAttrs(sc) + '>⤢ ' + esc(t('learnerView')) + '</button>' +
      '<button class="btn small" data-a="editLearner" data-id="' + esc(l.id) + '">' + esc(t('edit')) + '</button>' +
      '<button class="btn small warn" data-a="clearBoard" ' + scopeAttrs(sc) + '>' + esc(t('clearBoard')) + '</button></div>' + boardBody(sc, 'staff');
  }

  /* ---------------- groups (staff) ---------------- */
  function viewGroup() {
    var g = C.findGroup(S, ui.route.id);
    if (!g) return '<p>' + esc(t('noGroups')) + '</p>';
    var head = '<div class="boardhead"><button class="btn small" data-a="nav" data-to="home">' + esc(t('back')) + '</button><span><span class="nm">' + esc(tx(g.name)) + '</span><br><span class="tag">' + esc(t('arr_' + g.type)) + '</span></span><span class="spacer"></span>' +
      '<button class="btn small" data-a="lv" data-st="' + (g.type === 'individual' ? 'indiv' : g.type) + '" data-g="' + esc(g.id) + '">⤢ ' + esc(t('groupDisplay')) + '</button>' +
      '<button class="btn small" data-a="editGroup" data-id="' + esc(g.id) + '">' + esc(t('editMembers')) + '</button>' +
      (g.type !== 'individual' ? '<button class="btn small warn" data-a="clearBoard" data-st="' + g.type + '" data-g="' + esc(g.id) + '">' + esc(t('clearBoard')) + '</button>' : '') + '</div>';
    if (g.type === 'individual') return head + '<p class="lede">' + esc(t('arrd_individual')) + '</p>' + indivCards(g, 'staff');
    if (g.type === 'team') return head + boardBody({ type: 'team', groupId: g.id }, 'staff');

  }
  function indivCards(g, mode) {
    return '<div class="gcards">' + g.memberIds.map(function (id) {
      var l = C.findLearner(S, id);
      if (!l) return '';
      var sc = { type: 'learner', id: l.id }, info = boardInfo(sc), p = info.p, k = fxKey(sc);
      var newIndex = ui.fx && ui.fx.key === k ? ui.fx.index : -1;
      var act = '';
      if (mode === 'staff') {
        if (p.status === 'earning') act = '<button class="award" data-a="award" ' + scopeAttrs(sc) + '><span class="plus" aria-hidden="true">＋</span>' + esc(t('giveToken')) + '</button>';
        else if (p.status === 'complete') act = info.sel ? '<button class="btn go" data-a="deliver" ' + scopeAttrs(sc) + '>✓ ' + esc(t('confirmGiven', { item: tx(info.sel.label) })) + '</button>' : '<button class="btn primary" data-a="openChoice" ' + scopeAttrs(sc) + '>' + esc(t('needChoice')) + '</button>';
        else act = '<button class="btn primary" data-a="newBoard" ' + scopeAttrs(sc) + '>↻ ' + esc(t('newBoard')) + '</button>';
        act += '<div class="row">' + holdBtn('undo', t('holdUndo'), scopeAttrs(sc), 'small') + '<button class="btn small" data-a="openBoard" data-id="' + esc(l.id) + '" data-from="' + esc(g.id) + '">' + esc(t('openBoard')) + '</button><button class="btn small" data-a="lv" ' + scopeAttrs(sc) + ' data-from="' + esc(g.id) + '">⤢ ' + esc(t('fullScreen')) + '</button></div>';
      }
      var wf = info.sel ? rTag(info.sel) : '';
      return '<div class="gcard"><div class="row">' + avatar(l) + '<div><div class="t" style="font-weight:700;font-size:20px">' + esc(l.name) + '</div><div class="s" style="color:var(--muted);font-size:15px">' + esc(tx(l.goal.text)) + '</div></div></div>' +
        themeSvg(themeOf(l), p.earned, p.target, { newIdx: newIndex, small: true, animateDone: !!(ui.fx && ui.fx.key === k && ui.fx.completed) }) + '<div class="row">' + statusTag(p) + wf + '</div>' + act + '</div>';
    }).join('') + '</div>';
  }
  function sharedStaff(g) {
    var sc = { type: 'shared', groupId: g.id }, info = boardInfo(sc);
    var rows = g.memberIds.map(function (id) {
      var l = C.findLearner(S, id), c = g.board.contrib[id];
      if (!l || !c) return '';
      var lsc = { type: 'shared', groupId: g.id, learnerId: id }, k = fxKey(lsc);
      var met = c.earned >= c.target;
      var btn = g.board.status === 'earning' ? (met ? '<span class="tag ready">✓ ' + esc(t('met')) + '</span>' : '<button class="award" style="min-height:60px;min-width:150px;font-size:18px" data-a="award" ' + scopeAttrs(lsc) + '><span class="plus" aria-hidden="true">＋</span>' + esc(t('giveToken')) + '</button>') : '';
      return '<div class="contrib">' + avatar(l) + '<div><div style="font-weight:700">' + esc(l.name) + ' <span style="font-weight:400;color:var(--muted)">' + esc(t('ofN', { e: Math.min(c.earned, c.target), t: c.target })) + '</span></div>' +
        tray(c.earned, c.target, g.tokenFill === 'group' ? g.tokenStyle : l.tokenStyle, { mini: true, newIndex: ui.fx && ui.fx.key === k ? ui.fx.index : -1 }) +
        '<div class="stepper" style="margin-top:6px"><button data-a="contribTarget" data-g="' + esc(g.id) + '" data-l="' + esc(id) + '" data-d="-1" aria-label="−">−</button><output>' + c.target + '</output><button data-a="contribTarget" data-g="' + esc(g.id) + '" data-l="' + esc(id) + '" data-d="1" aria-label="+">+</button></div></div>' + btn + '</div>';
    }).join('');
    var right = '<div class="panel">' + goalBlock(info) + trayBlock(sc, info, 'staff') + statePanel(sc, info, 'staff') + staffControls(sc, info) + '</div>';

      '<div class="panel" style="margin-top:22px"><h3>' + esc(t('contribTargets')) + '</h3><p class="private">' + esc(t('privateNote')) + '</p>' + rows + '</div>';

  /* ---------------- learner view (full screen) ---------------- */
  function viewLV() {
    var sc = ui.route.scope, h = '<div class="lv">';
    if (sc.type === 'learner') {
      if (!C.findLearner(S, sc.id)) return '';
      h += lvBoard(sc);
    } else if (sc.type === 'indiv') {
      var g = C.findGroup(S, sc.groupId);
      if (!g) return '';
      h += '<div class="boardhead"><span class="nm">' + esc(tx(g.name)) + '</span></div>' + indivCards(g, 'learner');
    } else {
      h += lvBoard(sc);
    }
    h += '</div><button class="staffcorner" data-hold="sheet" data-ms="1000"><span class="fill"></span>' + esc(t('holdStaff')) + '</button>';
    if (ui.sheetOpen) h += staffSheet(sc);
    return h;
  }
  /* Full-screen board: the picture fills the screen, the reward sits in the top corner. */
  function rewardCorner(sc, info) {
    var b = info.r.board, label = info.r.kind === 'learner' ? tv('workingFor') : t('weWorkingFor');
    if (info.sel) {
      var can = b.status !== 'delivered';
      return '<button class="rcorner' + (b.status === 'complete' ? ' ready' : '') + '" ' + (can ? 'data-a="openChoice" ' + scopeAttrs(sc) : 'disabled') + '><span class="rl">' + esc(label) + '</span>' + rIcon(info.sel, 'rc-ic') + '<span class="rn">' + esc(tx(info.sel.label)) + '</span></button>';
    }
    if (info.timing === 'after' && b.status === 'earning') return '<div class="rcorner wait"><span class="rl">' + esc(label) + '</span>' + pic('gift', 'rc-ic') + '<span class="rn">' + esc(t('chooseLater')) + '</span></div>';
    return '<button class="rcorner ask" data-a="openChoice" ' + scopeAttrs(sc) + '><span class="rl">' + esc(label) + '</span>' + pic('ask', 'rc-ic') + '<span class="rn">' + esc(t('chooseWork')) + '</span></button>';
  }
  function lvBoard(sc) {
    var info = boardInfo(sc);
    if (!info) return '';
    var r = info.r, b = r.board, who;
    if (r.kind === 'learner') {
      var g = r.learner.goal || {}, gi = g.image ? '<img alt="" src="' + g.image + '">' : window.ATPics.svg(g.pic || 'goal');
      who = avatar(r.learner, 'lg') + '<span><span class="nm">' + esc(r.learner.name) + '</span>' + (tx(g.text) ? '<span class="lvgoal"><span class="gi" aria-hidden="true">' + gi + '</span>' + esc(tx(g.text)) + '</span>' : '') + '</span>';
    } else {
      who = '<span class="avatar lg grp" aria-hidden="true">' + window.ATPics.svg(r.kind === 'team' ? 'group' : 'goal') + '</span><span><span class="nm">' + esc(tx(r.group.name)) + '</span><span class="lvgoal">' + esc(r.kind === 'team' ? t('teamBoard') : t('sharedGoal')) + '</span></span>';
    }
    var stage = trayBlock(sc, info, 'learner');
    stage += statePanel(sc, info, 'learner');
    if (r.kind === 'team') stage += teamNoticed(r.group, 'learner');
    return '<div class="lvtop"><div class="lvwho">' + who + '</div>' + rewardCorner(sc, info) + '</div><div class="lvstage' + (b.status !== 'earning' ? ' done' : '') + '">' + stage + '</div>';
  }
  function goFullscreen() {
    var d = document.documentElement, fn = d.requestFullscreen || d.webkitRequestFullscreen;
    if (fn && !document.fullscreenElement && !document.webkitFullscreenElement) { try { var p = fn.call(d); if (p && p.catch) p.catch(function () {}); } catch (e) { /* not allowed here */ } }
  }
  function leaveFullscreen() {
    var fn = document.exitFullscreen || document.webkitExitFullscreen;
    if (fn && (document.fullscreenElement || document.webkitFullscreenElement)) { try { var p = fn.call(document); if (p && p.catch) p.catch(function () {}); } catch (e) { /* ignore */ } }
  }
  function staffSheet(sc) {
    var h = '<div class="sheet" role="dialog" aria-label="' + esc(t('staffControls')) + '"><h3>' + esc(t('staffControls')) + '<button class="btn small" data-a="exitLV">' + esc(t('exitLV')) + '</button></h3>';
    if (sc.type === 'indiv') {
      var g = C.findGroup(S, sc.groupId);
      h += '<div class="list">' + g.memberIds.map(function (id) {
        var l = C.findLearner(S, id);
        if (!l) return '';
        var lsc = { type: 'learner', id: id }, info = boardInfo(lsc);
        return '<div class="item"><span class="grow t">' + esc(l.name) + ' · ' + esc(t('ofN', { e: Math.min(info.p.earned, info.p.target), t: info.p.target })) + '</span>' + staffControls(lsc, info).replace('class="controls"', 'class="controls" style="margin:0"') + '</div>';
      }).join('') + '</div>';
    } else if (sc.type === 'shared') {
      var gg = C.findGroup(S, sc.groupId), info2 = boardInfo(sc);
      if (gg.board.status === 'earning') {
        h += '<div class="chips">' + gg.memberIds.map(function (id) {
          var l = C.findLearner(S, id), c = gg.board.contrib[id];
          if (!l || !c) return '';
          var met = c.earned >= c.target;
          return '<button class="chip" data-a="award" ' + scopeAttrs({ type: 'shared', groupId: gg.id, learnerId: id }) + (met ? ' disabled' : '') + '>＋ ' + esc(l.name) + ' (' + Math.min(c.earned, c.target) + '/' + c.target + ')</button>';
        }).join('') + '</div>';
      }
      h += staffControls(sc, info2);
    } else {
      var info = boardInfo(sc);
      if (info.r.kind === 'team') h += teamChips(info.r.group);

    pick: function (el) {
      var f = el.getAttribute('data-f'), v = el.getAttribute('data-v'), d = ui.draft;
      if (f.indexOf('s.') === 0) {
        var k = f.slice(2);
        S.settings[k] = v === 'true' ? true : v === 'false' ? false : v;
        save(); render();
        if (k === 'tokenSound') soundToken();
        return;
      }
      if (f === 'avatar') { d.avatar = v; d.avatarImage = null; }
      else if (f === 'goalIcon') { d.goal.icon = v; d.goal.image = null; }
      else if (f === 'icon') { d.icon = v; d.image = null; }
      else if (f === 'target') d.target = parseInt(v, 10);
      else d[f] = v;
      render();
    },
    clearImg: function (el) {
      var f = el.getAttribute('data-f'), d = ui.draft;
      if (f === 'goalImage') d.goal.image = null; else d[f] = null;
      render();
    },
    saveLearner: function () {
      var d = ui.draft;
      d.name = (d.name || '').trim();
      if (!d.name) { ui.formErr = t('nameRequired'); return render(); }
      if (!d.reinforcerIds.length) { ui.formErr = t('menuRequired'); return render(); }
      d.target = C.clampInt(d.target, 1, 30, 5);
      var orig = C.findLearner(S, d.id);
      d.goal.text = keepOrText(orig && orig.goal.text, (d._goalText || '').trim());
      var clean = stripDraft(d);
      commit(function () {
        if (orig) {
          clean.board = orig.board; // never touch progress from the editor
          S.learners[S.learners.indexOf(orig)] = clean;
        } else S.learners.push(clean);
        var sel = clean.board.selectedId;
        if (sel && clean.reinforcerIds.indexOf(sel) === -1 && clean.board.status !== 'delivered') clean.board.selectedId = null;
        C.recheck(S, { type: 'learner', id: clean.id });
        ui.route = { name: 'learners' };
      });
      toast(t('saved'));
    },
    editGroup: function (el) {
      var id = el.getAttribute('data-id');
      requireStaff(function () { ui.draft = newDraftGroup(id ? C.findGroup(S, id) : null); go({ name: 'groupEdit' }); });
    },
    dupGroup: function (el) {
      commit(function () { C.duplicateGroup(S, el.getAttribute('data-id'), { en: I.en.copySuffix, de: I.de.copySuffix }); });
    },
    delGroup: function (el) {
      var g = C.findGroup(S, el.getAttribute('data-id'));
      confirmBox({ title: t('deleteQ', { name: tx(g.name) }), body: t('deleteGroupBody'), okLabel: t('del'), danger: true, onOk: function () { S.groups = S.groups.filter(function (x) { return x.id !== g.id; }); save(); render(); toast(t('deleted')); } });
    },
    draftContrib: function (el) {
      var c = ui.draft.board.contrib[el.getAttribute('data-l')];
      c.target = C.clampInt(c.target + parseInt(el.getAttribute('data-d'), 10), 1, 20, 3);
      render();
    },
    saveGroup: function () {
      var d = ui.draft, name = (d._name || '').trim();
      if (!name) { ui.formErr = t('nameRequired'); return render(); }
      if (!d.memberIds.length) { ui.formErr = t('membersRequired'); return render(); }
      if (d.type !== 'individual' && !d.reinforcerIds.length) { ui.formErr = t('menuRequired'); return render(); }
      var orig = C.findGroup(S, d.id);
      d.name = keepOrText(orig && orig.name, name);
      if (d.type === 'team') {
        d.target = C.clampInt(d.target, 1, 40, 10);
        var oldEx = (orig && orig.examples) || [];
        d.examples = (d._examples || '').split('\n').map(function (s) { return s.trim(); }).filter(Boolean).map(function (s) {
          for (var i = 0; i < oldEx.length; i++) if (tx(oldEx[i]) === s) return oldEx[i];
          return s;
        });
      }
      if (d.type === 'shared') C.syncSharedMembers(S, d);
      var clean = stripDraft(d);
      commit(function () {
        if (orig) {
          if (clean.type === 'team') clean.board = orig.board; // keep earned tokens
          if (clean.type === 'shared') {
            // keep earned counts, take new targets/membership
            Object.keys(clean.board.contrib).forEach(function (id) {
              var o = orig.board.contrib[id];
              clean.board.contrib[id].earned = o ? o.earned : 0;
            });
            clean.board.status = orig.board.status; clean.board.cycle = orig.board.cycle; clean.board.selectedId = orig.board.selectedId;
            clean.board.stack = (orig.board.stack || []).filter(function (id) { return clean.memberIds.indexOf(id) !== -1; });
          }
          S.groups[S.groups.indexOf(orig)] = clean;
        } else S.groups.push(clean);
        if (clean.type !== 'individual') C.recheck(S, { type: clean.type, groupId: clean.id });
        ui.route = { name: 'groups' };
      });
      toast(t('saved'));
    },
    editR: function (el) {
      var id = el.getAttribute('data-id');
      requireStaff(function () { ui.draft = newDraftR(id ? C.findReinforcer(S, id) : null); go({ name: 'reinforcerEdit' }); });
    },
    toggleR: function (el) { commit(function () { var r = C.findReinforcer(S, el.getAttribute('data-id')); C.setAvailability(S, r.id, !r.available); }); },
    delR: function (el) {
      var r = C.findReinforcer(S, el.getAttribute('data-id'));
      confirmBox({ title: t('deleteQ', { name: tx(r.label) }), body: t('deleteRBody'), okLabel: t('del'), danger: true, onOk: function () { C.deleteReinforcer(S, r.id); save(); render(); toast(t('deleted')); } });
    },
    saveR: function () {
      var d = ui.draft, label = (d._label || '').trim();
      if (!label) { ui.formErr = t('labelRequired'); return render(); }
      var orig = C.findReinforcer(S, d.id);
      d.label = d._libObj && tx(d._libObj) === label ? d._libObj : keepOrText(orig && orig.label, label);
      d.duration = C.clampInt(d.duration, 0, 120, 0);
      var clean = stripDraft(d);
      var back = ui.afterR;
      ui.afterR = null;
      commit(function () {
        if (orig) S.reinforcers[S.reinforcers.indexOf(orig)] = clean; else S.reinforcers.push(clean);
        ui.route = { name: 'reinforcers' };
        if (back && ui.start && ui.start.lid === back.lid) {
          var bl = C.findLearner(S, back.lid);
          if (bl && bl.reinforcerIds.indexOf(clean.id) === -1) bl.reinforcerIds.push(clean.id);
          ui.start.rid = clean.id;
          ui.route = { name: 'start' };
        }
      });
      toast(t('saved'));
    },
    /* history & data */
    csv: function () { download('adaptability-tokens-' + stamp() + '.csv', C.toCSV(S, histFilterObj()), 'text/csv;charset=utf-8'); },
    clearHist: function () {
      confirmBox({ title: t('clearHistQ'), body: t('clearHistBody'), okLabel: t('clearHistory').replace('…', ''), danger: true, onOk: function () { S.log = []; save(); render(); } });
    },
    savePin: function () {
      var a = document.getElementById('pin1').value, b = document.getElementById('pin2').value;
      if (a !== b || !/^\d{4,8}$/.test(a)) { toast(t('pinMismatch')); return; }
      commit(function () { S.settings.pin = a; S.settings.pinChanged = true; });
      toast(t('pinSaved'));
    },
    backup: function () { download('adaptability-tokens-backup-' + stamp() + '.json', C.makeBackup(S), 'application/json'); },
    restore: function () { ui.modal = { type: 'restore' }; renderLayer(); },
    restoreGo: function () {
      var text = (document.getElementById('restoreText').value || '').trim();
      var res = C.parseBackup(text);
      if (!res.ok) { ui.modal.err = t('badBackup'); renderLayer(); return; }
      confirmBox({
        title: t('restoreQ'), body: t('restoreBody', { date: fmtDateTime(res.exportedAt) }), okLabel: t('restoreBtn'), danger: true,
        onOk: function () { S = res.state; save(); ui.route = { name: 'settings' }; render(); toast(t('restored')); }
      });
    },
    copyText: function () {
      var ta = document.getElementById('exportText');
      ta.select();
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (e) { /* ignore */ }
      if (navigator.clipboard) navigator.clipboard.writeText(ta.value).then(function () { toast(t('copied')); }).catch(function () { if (ok) toast(t('copied')); });
      else if (ok) toast(t('copied'));
    },
    persist: function () {
      navigator.storage.persist().then(function (p) { ui.persisted = p; render(); }).catch(function () { ui.persisted = false; render(); });
    },
    resetAll: function () {
      var word = t('resetWord');
      confirmBox({
        title: t('resetAllQ'), body: t('resetAllBody', { word: word }), word: word, okLabel: t('resetAll').replace('…', ''), danger: true,
        onOk: function () { var keep = { lang: S.settings.lang }; S = C.seed(); S.settings.lang = keep.lang; save(); ui.route = { name: 'home' }; render(); toast(t('resetDone')); }
      });
    }
  };
  var HOLD = {
    undo: function (el) {
      var sc = scopeFrom(el);
      var res = C.undo(S, sc);
      if (res.ok) { save(); render(); toast(t('undone')); } else toast(t('nothingUndo'));
      touchSheet();
    },
    sheet: function () { ui.sheetOpen = !ui.sheetOpen; render(); touchSheet(); }
  };

  /* ---------------- events ---------------- */
  document.addEventListener('click', function (ev) {
    var el = ev.target.closest('[data-a]');
    if (!el || el.disabled) return;
    var a = el.getAttribute('data-a');
    if (!a || !A[a]) return;
    if (a !== 'closeModal') ev.preventDefault();
    A[a](el, ev);
  });
  var holdT = null, holdEl = null;
  function endHold() { clearTimeout(holdT); holdT = null; if (holdEl) holdEl.classList.remove('holding'); holdEl = null; }
  document.addEventListener('pointerdown', function (ev) {
    var el = ev.target.closest('[data-hold]');
    if (!el || el.disabled) return;
    var ms = parseInt(el.getAttribute('data-ms') || '800', 10);
    holdEl = el;
    el.style.setProperty('--hold-ms', ms + 'ms');
    void el.offsetWidth;
    el.classList.add('holding');
    holdT = setTimeout(function () { var e = holdEl; endHold(); if (navigator.vibrate) navigator.vibrate(20); HOLD[e.getAttribute('data-hold')](e); }, ms);
  });
  ['pointerup', 'pointercancel'].forEach(function (n) { document.addEventListener(n, endHold); });
  document.addEventListener('contextmenu', function (ev) { if (ev.target.closest('[data-hold]')) ev.preventDefault(); });
  document.addEventListener('keydown', function (ev) {
    var el = ev.target.closest && ev.target.closest('[data-hold]');
    if (el && (ev.key === 'Enter' || ev.key === ' ')) { ev.preventDefault(); HOLD[el.getAttribute('data-hold')](el); }
    if (ev.key === 'Escape' && ui.modal && ui.modal.type !== 'confirm') { ui.modal = null; renderLayer(); }
  });
  document.addEventListener('input', function (ev) {
    var el = ev.target, f = el.getAttribute('data-f');
    if (!f) return;
    var d = ui.draft;
    if (f === 'histFilter') { ui.histFilter = el.value; render(); return; }
    if (!d) return;
    if (f === 'goalText') d._goalText = el.value;
    else if (f === 'gname') d._name = el.value;
    else if (f === 'rlabel') d._label = el.value;
    else if (f === 'examples') d._examples = el.value;
    else if (f === 'target') d.target = el.value;
    else if (f === 'duration') d.duration = el.value;
    else d[f] = el.value;
  });
  document.addEventListener('change', function (ev) {
    var el = ev.target, d = ui.draft;
    if (el.hasAttribute('data-start-offer') && ui.start) { ui.start.offer = el.checked; return; }
    if (el.getAttribute('data-f') === 'target' && d) { d.target = C.clampInt(el.value, 1, d.type === 'team' ? 40 : 30, 5); render(); return; }
    if (el.hasAttribute('data-check') && d) {
      var k = el.getAttribute('data-check');
      if (k === 'group' || k === 'available') { d[k] = el.checked; return; }
      var arr = d[k], v = el.value, i = arr.indexOf(v);
      if (el.checked && i === -1) arr.push(v);
      if (!el.checked && i !== -1) arr.splice(i, 1);
      if (k === 'memberIds' && d.type === 'shared') { C.syncSharedMembers(S, d); render(); }
      return;
    }
    if (el.hasAttribute('data-radio') && d) {
      var rk = el.getAttribute('data-radio');
      if (rk === 'mode') { d.type = el.value === 'independent' ? 'individual' : (d.type === 'individual' ? 'team' : d.type); ensureGroupFields(d); render(); return; }
      d[rk] = el.value;
      if (rk === 'tokenType' && el.value === 'theme' && !d.theme) d.theme = 'cookie';
      if (rk === 'type') ensureGroupFields(d);
      render(); return;
    }
    if (el.hasAttribute('data-upload') && el.files && el.files[0] && d) {
      var f = el.getAttribute('data-upload');
      readImage(el.files[0]).then(function (url) {
        if (f === 'goalImage') d.goal.image = url; else d[f] = url;
        render();
      }).catch(function () { toast('Image could not be read'); });
      return;
    }
    if (el.hasAttribute('data-restore-file') && el.files && el.files[0]) {
      var fr = new FileReader();
      fr.onload = function () { document.getElementById('restoreText').value = fr.result; };
      fr.readAsText(el.files[0]);
    }
  });
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden' && S) save(); });

  /* ---------------- start ---------------- */
  if (window.ATThemes) { var thcss = document.createElement('style'); thcss.textContent = window.ATThemes.css; document.head.appendChild(thcss); }
  load().then(function (data) {
    S = C.ensureShape(data || (/[?&]demo=1/.test(location.search) ? C.demo() : C.seed()));
    var lr = S.settings.lastRoute;
    if (lr && lr.name) {
      var valid = (lr.name === 'board' && C.findLearner(S, lr.id)) || (lr.name === 'group' && C.findGroup(S, lr.id)) ||
        (lr.name === 'lv' && lr.scope && (lr.scope.type === 'learner' ? C.findLearner(S, lr.scope.id) : C.findGroup(S, lr.scope.groupId)));
      if (valid) ui.route = lr;
    }
    save();
    render();
    if (navigator.storage && navigator.storage.persisted) navigator.storage.persisted().then(function (p) { ui.persisted = p ? true : null; }).catch(function () {});
  });
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1') && !inFrame() && !/claude|anthropic/i.test(location.hostname)) {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
  }
  window.__AT = { get state() { return S; }, ui: ui, render: render };
})();

</script>
</body>
</html>
